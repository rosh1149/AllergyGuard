services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: allergyguard
      POSTGRES_PASSWORD: allergyguard
      POSTGRES_DB: allergyguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allergyguard"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://allergyguard:allergyguard@db:5432/allergyguard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
