name: CI

# Every push and pull request runs the tests and the allergen safety gate. The "release" job, which
# is where a deployment step would go, runs only when all of them pass. Make "safety-gate" a
# required status check on main so a change that fails the release criteria cannot be merged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety-gate:
    name: Safety gate (evaluation benchmark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run benchmark and release criteria
        run: python -m app.evaluation --report evaluation-report.md --json evaluation.json
      - name: Add report to the job summary
        if: always()
        run: test -f evaluation-report.md && cat evaluation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: |
            backend/evaluation-report.md
            backend/evaluation.json

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: allergyguard
          POSTGRES_PASSWORD: allergyguard
          POSTGRES_DB: allergyguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allergyguard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://allergyguard:allergyguard@localhost:5432/allergyguard_test
      DATABASE_URL: postgresql+psycopg://allergyguard:allergyguard@localhost:5432/allergyguard_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  release:
    name: Release (all criteria met)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [safety-gate, backend-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests and allergen safety release criteria passed. Add the deployment step here."
